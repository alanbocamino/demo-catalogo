<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal do Representante</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; color: #333; }
        
        .login-container { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-container h2 { color: #0c2461; margin-bottom: 10px; font-size: 1.8rem; }
        .login-container p { color: #747d8c; margin-bottom: 30px; font-size: 0.9rem; }
        
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 5px; color: #2f3542; font-weight: 500; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ced6e0; border-radius: 5px; font-size: 1rem; transition: border 0.3s; }
        .input-group input:focus { border-color: #4a69bd; outline: none; }
        
        .error-msg { color: #e74c3c; font-size: 0.85rem; margin-bottom: 15px; display: none; }
        
        button { background-color: #4a69bd; color: #fff; border: none; padding: 12px; border-radius: 5px; width: 100%; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #0c2461; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Área do Representante</h2>
        <p>Faça login para acessar o catálogo</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário" required>
            </div>
            
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <div id="errorMsg" class="error-msg">Usuário ou senha incorretos! (Dica: use admin/admin)</div>

            <button type="submit">Entrar no Sistema</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita recarregar a página
            
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('senha').value;
            const errorMsg = document.getElementById('errorMsg');

            // Validação simples para demonstração
            if(user === 'admin' && pass === 'admin') {
                errorMsg.style.display = 'none';
                alert('Login aprovado! Em um sistema real, você seria redirecionado para o catálogo.');
                // window.location.href = 'catalogo.html'; // Descomente para redirecionar de verdade
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>

</body>
</html>
